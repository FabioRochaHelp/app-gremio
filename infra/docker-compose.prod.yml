# Produção numa VPS (fora da rede da corporação), atrás do proxy reverso do servidor,
# que faz o HTTPS e repassa DOMINIO e arquivos.DOMINIO para 127.0.0.1:3000.
# Uso, a partir da pasta infra/:
#   cp .env.prod.example .env.prod   # e preencha
#   cp s3.prod.json.example s3.prod.json   # e troque as chaves
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: gremio

x-api: &api
  build:
    context: ..
    dockerfile: infra/Dockerfile.api
  image: gremio-api
  restart: unless-stopped
  env_file: .env.prod
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  s3:
    image: chrislusf/seaweedfs:4.30
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    volumes:
      - s3data:/data
      - ./s3.prod.json:/etc/seaweedfs/s3.json:ro

  # Aplica as migrations antes de a API subir.
  migrate:
    image: gremio-api
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      S3_ENDPOINT_PUBLICO: https://arquivos.${DOMINIO}
      PROCESSAR_FILAS: "false"
      # Dois saltos: proxy reverso do servidor e o Caddy.
      TRUST_PROXY: "2"

  # Leitura de comprovantes, avisos, PDF mensal e tarefas agendadas.
  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      S3_ENDPOINT_PUBLICO: https://arquivos.${DOMINIO}
      PROCESSAR_FILAS: "true"

  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
    # Só o proxy reverso do servidor acessa; ele faz o HTTPS e repassa para cá.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - s3data:/s3data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  s3data:
